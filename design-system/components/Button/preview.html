<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button — preview</title>
<style>
  body { margin: 0; min-height: 0; padding: 18px 20px; }
</style>
</head>
<body class="nc">
<div class="nc-btns" style="margin-bottom:14px">
  <button class="nc-btn">Continue</button>
  <button class="nc-btn nc-btn--pink">▶ Start</button>
  <button class="nc-btn nc-btn--gold">◆ Shop</button>
  <button class="nc-btn nc-btn--red">× Quit</button>
  <button class="nc-btn" disabled>Locked</button>
</div>
<div class="nc-btns">
  <button class="nc-btn nc-btn--solid">Solid</button>
  <button class="nc-btn nc-btn--ghost">Ghost</button>
  <button class="nc-btn" aria-pressed="true">Pressed</button>
  <button class="nc-btn nc-btn--sm">Small</button>
  <button class="nc-btn nc-btn--lg nc-btn--pink">▶ Large</button>
  <button class="nc-btn nc-btn--icon" aria-label="Home">⌂</button>
</div>
</body>
</html>
