<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meter — preview</title>
<style>
  body { margin: 0; min-height: 0; padding: 18px 20px; }
</style>
</head>
<body class="nc">
<p class="nc-label" style="margin:0 0 6px">Hold Esc to quit</p>
<div class="nc-meter nc-meter--pink" style="--nc-value:.6" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"></div>
<p class="nc-label" style="margin:12px 0 6px">Shield</p>
<div class="nc-meter" style="--nc-value:.85" role="meter" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100"></div>
<p class="nc-label" style="margin:12px 0 6px">Download</p>
<div class="nc-meter nc-meter--lime nc-meter--fluid" style="--nc-value:.5;--nc-cells:24;max-width:400px" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
</body>
</html>
